version: "3.9"

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    # ports:
    #   - "9090:9090"
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    # extra_hosts:
    #   - "host.docker.internal:172.30.215.216"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    # ports:
    #   - "3000:3000"
    network_mode: host
    restart: unless-stopped
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: gateway-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true

    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped
  
  loki:
    image: grafana/loki:3.0.0
    container_name: gateway-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    
  promtail:
    image: grafana/promtail:3.0.0
    container_name: gateway-promtail
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml
      - ../logs:/logs
    command: -config.file=/etc/promtail/config.yml